name: Test free no-account uncensored Spaces

# One runner per Space (Hugging Face's anonymous GPU quota is per visitor). Read-only.
on:
  push:
    paths:
      - "remote/try_space.py"
      - "remote/test_openai_space.py"
      - ".github/workflows/test-free-spaces.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-openai:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u remote/test_openai_space.py https://rikunarita-org-qwen3-6-35b-a3b-uncensored-hauhau-3cbf2f6.hf.space
  zerogpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        space:
          - "ukung/Muse-Glimmer-30B-DFlash-Abliterated /chat"
          - "FireDuckOnFire/dolphin-mistral-24b-venice /chat"
          - "zk-Armor/qwen3.8-27b-uncensored-chatbot /chat"
          - "markpaulm/gemma-4-31B-it-abliterated /chat"
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u remote/try_space.py ${{ matrix.space }}
